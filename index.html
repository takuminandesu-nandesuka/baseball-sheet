<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポジション、年齢別／球団バランスシート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background-color: #f4f5f7;
      color: #1a1a1a;
      -webkit-tap-highlight-color: transparent;
    }

    /* スクロールなし・1画面画角フィット設計 */
    .table-scroll-wrapper {
      overflow: hidden;
      border: 1.5px solid #374151;
      border-radius: 6px;
      position: relative;
      width: 100%;
    }

    /* バランスシート特有の太線・配色再現（横幅100%固定・横スクロール廃止） */
    .bs-table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      background: #ffffff;
    }

    .bs-table th,
    .bs-table td {
      border-bottom: 1px solid #d1d5db;
      border-right: 1.5px solid #4b5563;
      padding: 1px 2px;
      text-align: center;
      vertical-align: middle;
      line-height: 1.15;
      word-break: break-all;
      overflow-wrap: anywhere;
    }

    /* ポジション大分類の太い縦境界線 */
    .thick-right {
      border-right: 3px solid #1f2937 !important;
    }

    /* 左端「年齢」列 */
    .sticky-age-header {
      background-color: #1f2937;
      color: #ffffff;
      font-weight: 900;
      border-right: 3px solid #1f2937 !important;
      border-bottom: 2px solid #1f2937 !important;
      font-size: clamp(10px, 1.1vw, 13px);
    }

    .sticky-age-cell {
      border-right: 3px solid #1f2937 !important;
      font-size: clamp(10px, 1.15vw, 13px);
      padding: 1px 0 !important;
    }

    /* ヘッダー配色 */
    .header-pos-main {
      background-color: #004499;
      color: #ffe600;
      font-weight: 900;
      letter-spacing: 0.05em;
      height: 26px;
      border-bottom: 1.5px solid #1f2937 !important;
      font-size: clamp(11px, 1.3vw, 15px);
    }
    .header-pos-sub {
      background-color: #ffffff;
      color: #008000;
      font-weight: 900;
      height: 22px;
      border-bottom: 2px solid #1f2937 !important;
      font-size: clamp(10px, 1.15vw, 13px);
    }

    /* 年齢別行の背景色 */
    .row-40plus, .row-40plus .sticky-age-cell { background-color: #f3d6e4; }
    .row-30s-even, .row-30s-even .sticky-age-cell { background-color: #dedbe6; }
    .row-30s-odd, .row-30s-odd .sticky-age-cell { background-color: #ffffff; }
    .row-20s-odd, .row-20s-odd .sticky-age-cell { background-color: #cbe0f2; }
    .row-20s-even, .row-20s-even .sticky-age-cell { background-color: #ffffff; }
    .row-19under, .row-19under .sticky-age-cell { background-color: #d5e2d8; }

    /* 編集可能セルのスタイル（1画面に全22行収まる高さ・画面幅連動フォント） */
    .editable-cell {
      height: 24px;
      cursor: text;
      font-weight: 800;
      font-size: clamp(10px, 1.15vw, 13.5px);
      transition: box-shadow 0.15s ease, background-color 0.15s ease;
      outline: none;
    }
    .editable-cell:hover {
      box-shadow: inset 0 0 0 1.5px rgba(0, 68, 153, 0.45);
    }
    .editable-cell:focus {
      box-shadow: inset 0 0 0 2px #004499;
      background-color: rgba(255, 255, 255, 0.96) !important;
    }

    /* タップ装飾切替モード時のスタイル */
    .tap-style-mode .editable-cell {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .tap-style-mode .player-token {
      padding: 0 3px;
      border-radius: 3px;
      border: 1px dashed rgba(0, 68, 153, 0.5);
      display: inline-block;
    }

    /* 選手名の装飾（画像準拠） */
    .player-red {
      background-color: #e60012;
      color: #ffffff;
      padding: 0 3px;
      border-radius: 2px;
      display: inline-block;
      line-height: 1.15;
    }
    .player-blue {
      color: #005bac;
    }
    .player-normal {
      color: #111111;
    }

    /* 印刷時の最適化 */
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background: #ffffff;
      }
      .table-scroll-wrapper {
        border: none !important;
      }
      .sheet-container {
        box-shadow: none !important;
        padding: 0 !important;
        max-width: 100% !important;
      }
    }
  </style>
</head>
<body class="p-1.5 sm:p-2.5">

  <!-- 操作ツールバー（上部コンパクト配置） -->
  <div class="no-print max-w-[1400px] mx-auto mb-2 bg-white rounded-xl shadow-sm border border-gray-200 px-3 py-2">
    <div class="flex flex-wrap items-center justify-between gap-2">
      
      <!-- 年度入力窓＆年度更新コントロール -->
      <div class="flex flex-wrap items-center gap-1.5">
        <div class="flex items-center bg-blue-50 border-2 border-[#004499] rounded-lg px-2 py-0.5 min-h-[36px] shadow-inner">
          <label for="yearInput" class="text-xs font-bold text-[#004499] mr-1 whitespace-nowrap">年度：</label>
          <input
            id="yearInput"
            type="text"
            value="2026年度"
            aria-label="対象年度"
            class="w-24 sm:w-28 text-sm font-black text-gray-900 bg-white border border-blue-300 rounded px-1.5 py-0.5 text-center focus:outline-none focus:ring-2 focus:ring-[#004499]"
            placeholder="例: 2026年度"
          />
        </div>

        <button
          id="advanceYearBtn"
          type="button"
          class="min-h-[36px] bg-[#004499] hover:bg-blue-800 active:scale-[0.98] text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1 cursor-pointer"
          title="年度を1つ進め、全選手の年齢を1歳上へ移動します"
        >
          <span>翌年度へ更新（+1歳）</span>
        </button>

        <button
          id="undoBtn"
          type="button"
          disabled
          class="min-h-[36px] bg-gray-100 hover:bg-gray-200 disabled:opacity-40 disabled:pointer-events-none text-gray-700 font-bold text-xs px-2.5 py-1.5 rounded-lg border border-gray-300 transition cursor-pointer"
          title="直前の操作を取り消します"
        >
          ↩ 戻す
        </button>
      </div>

      <!-- iPadタッチ対応：タップ装飾切替モード & データ管理 -->
      <div class="flex flex-wrap items-center gap-1.5">
        <button
          id="shareUrlBtn"
          type="button"
          class="min-h-[36px] bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1 transition cursor-pointer"
          title="現在の入力内容を含んだ共有用URLをコピーします"
        >
          <span>🔗 共有URL</span>
        </button>

        <button
          id="tapModeBtn"
          type="button"
          aria-pressed="false"
          class="min-h-[36px] bg-amber-50 hover:bg-amber-100 text-amber-900 border-2 border-amber-400 font-black text-xs px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 cursor-pointer"
          title="ONにすると選手名をタップするだけで『黒字→赤枠白字→青字』を切り替えられます"
        >
          <span>👆 タップ装飾:</span>
          <span id="tapModeStatus" class="bg-gray-600 text-white text-[10px] px-1.5 py-0.5 rounded">OFF</span>
        </button>

        <div class="hidden lg:flex items-center gap-1 bg-gray-100 p-0.5 rounded-lg border border-gray-200 min-h-[36px]">
          <button type="button" data-style="normal" class="style-btn px-2 py-1 text-xs font-bold bg-white text-gray-900 rounded border border-gray-300 hover:bg-gray-50 cursor-pointer">黒字</button>
          <button type="button" data-style="red" class="style-btn px-2 py-1 text-xs font-bold bg-[#e60012] text-white rounded hover:opacity-90 cursor-pointer">赤枠</button>
          <button type="button" data-style="blue" class="style-btn px-2 py-1 text-xs font-bold bg-white text-[#005bac] rounded border border-gray-300 hover:bg-blue-50 cursor-pointer">青字</button>
        </div>

        <button
          id="exportBtn"
          type="button"
          class="min-h-[36px] bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-bold text-xs px-2.5 py-1.5 rounded-lg transition cursor-pointer"
        >
          保存
        </button>

        <button
          id="importBtn"
          type="button"
          class="min-h-[36px] bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-bold text-xs px-2.5 py-1.5 rounded-lg transition cursor-pointer"
        >
          読込
        </button>
        <input id="importFileInput" type="file" accept=".json,application/json" class="hidden" />

        <button
          id="resetBtn"
          type="button"
          class="min-h-[36px] bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 font-bold text-xs px-2.5 py-1.5 rounded-lg transition cursor-pointer"
        >
          白紙リセット
        </button>
      </div>
    </div>

    <!-- ガイド表示・集計サマリー -->
    <div class="mt-1.5 pt-1.5 border-t border-gray-100 flex flex-wrap items-center justify-between gap-2 text-[11px] text-gray-600">
      <div id="modeGuideText" class="flex-1 min-w-[220px]">
        💡 枠をタップして<strong class="text-gray-800">直接文字入力</strong>（複数名は「・」区切り）。色分けは「👆 タップ装飾」をONにしてタップで切替。
      </div>
      <div id="playerCountSummary" class="font-bold text-gray-800 bg-gray-100 px-2 py-0.5 rounded">
        合計 0名（投手:0 / 捕手:0 / 内野:0 / 外野:0）
      </div>
    </div>
  </div>

  <!-- バランスシート本体（1画面フィット） -->
  <div class="sheet-container max-w-[1400px] mx-auto bg-white p-2 sm:p-3 rounded-xl shadow-md border border-gray-200">
    <!-- タイトル行 -->
    <div class="flex flex-wrap items-center justify-center gap-2 mb-1.5">
      <span id="sheetYearBadge" class="bg-[#004499] text-white font-black text-xs sm:text-sm px-2.5 py-0.5 rounded shadow-sm">
        2026年度
      </span>
      <h1
        id="sheetTitle"
        contenteditable="true"
        spellcheck="false"
        class="text-base sm:text-xl font-black text-gray-800 tracking-wide text-center px-2 rounded hover:bg-gray-100 focus:bg-blue-50 focus:outline-none"
        title="クリックしてタイトルも自由に編集できます"
      >
        ポジション、年齢別／12球団バランスシート
      </h1>
    </div>

    <!-- テーブルラッパー（横スクロールなし・全列100%フィット） -->
    <div id="tableScrollWrapper" class="table-scroll-wrapper">
      <table id="sheetTable" class="bs-table">
        <colgroup>
          <col style="width: 4.5%;" />
          <col style="width: 10.6%;" />
          <col style="width: 11.6%;" />
          <col style="width: 9.5%;" />
          <col style="width: 10.6%;" />
          <col style="width: 8.5%;" />
          <col style="width: 10.6%;" />
          <col style="width: 10.6%;" />
          <col style="width: 8.5%;" />
          <col style="width: 10.6%;" />
        </colgroup>
        <thead>
          <tr>
            <th rowspan="2" class="sticky-age-header leading-tight">
              年<br />齢
            </th>
            <th colspan="2" class="header-pos-main thick-right">投手</th>
            <th class="header-pos-main thick-right">捕手</th>
            <th colspan="3" class="header-pos-main thick-right">内野手</th>
            <th colspan="3" class="header-pos-main thick-right">外野手</th>
          </tr>
          <tr>
            <th class="header-pos-sub">左投</th>
            <th class="header-pos-sub thick-right">右投</th>
            <th class="header-pos-sub thick-right"></th>
            <th class="header-pos-sub">左打</th>
            <th class="header-pos-sub">両打</th>
            <th class="header-pos-sub thick-right">右打</th>
            <th class="header-pos-sub">左打</th>
            <th class="header-pos-sub">両打</th>
            <th class="header-pos-sub thick-right">右打</th>
          </tr>
        </thead>
        <tbody id="sheetBody"></tbody>
      </table>
    </div>
  </div>

  <!-- カスタム確認モーダル -->
  <div id="confirmModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-xl border border-gray-200">
      <h3 id="modalTitle" class="text-base font-black text-gray-900 mb-2">確認</h3>
      <p id="modalMessage" class="text-sm text-gray-600 mb-5 leading-relaxed"></p>
      <div class="flex justify-end gap-2">
        <button id="modalCancelBtn" type="button" class="px-4 py-2 text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg cursor-pointer">
          キャンセル
        </button>
        <button id="modalOkBtn" type="button" class="px-4 py-2 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-lg cursor-pointer">
          実行する
        </button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div
    id="statusToast"
    class="fixed bottom-4 right-4 bg-gray-900 text-white text-xs sm:text-sm font-bold px-4 py-2 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50"
  ></div>

  <script>
    (function () {
      const STORAGE_KEY = 'baseball_balance_sheet_gh_v1';

      const AGE_ROWS = [
        '40~', '39', '38', '37', '36', '35', '34', '33', '32', '31', '30',
        '29', '28', '27', '26', '25', '24', '23', '22', '21', '20', '~19'
      ];

      const COLUMNS = [
        { key: 'p_l', groupClass: '' },
        { key: 'p_r', groupClass: 'thick-right' },
        { key: 'c',   groupClass: 'thick-right' },
        { key: 'if_l', groupClass: '' },
        { key: 'if_s', groupClass: '' },
        { key: 'if_r', groupClass: 'thick-right' },
        { key: 'of_l', groupClass: '' },
        { key: 'of_s', groupClass: '' },
        { key: 'of_r', groupClass: 'thick-right' }
      ];

      function createEmptyInitialData() {
        const emptyCells = {};
        AGE_ROWS.forEach((age) => {
          emptyCells[age] = {};
          COLUMNS.forEach((col) => {
            emptyCells[age][col.key] = [];
          });
        });
        return {
          year: '2026年度',
          title: 'ポジション、年齢別／12球団バランスシート',
          cells: emptyCells
        };
      }

      function encodeDataToHash(obj) {
        try {
          const json = JSON.stringify(obj);
          const bytes = new TextEncoder().encode(json);
          let binString = '';
          bytes.forEach((b) => { binString += String.fromCharCode(b); });
          return btoa(binString).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        } catch (e) {
          return '';
        }
      }

      function decodeDataFromHash(hashStr) {
        try {
          let b64 = hashStr.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          const binString = atob(b64);
          const bytes = new Uint8Array(binString.length);
          for (let i = 0; i < binString.length; i++) {
            bytes[i] = binString.charCodeAt(i);
          }
          const json = new TextDecoder().decode(bytes);
          return JSON.parse(json);
        } catch (e) {
          return null;
        }
      }

      function loadInitialState() {
        try {
          const hash = window.location.hash;
          if (hash && hash.startsWith('#data=')) {
            const decoded = decodeDataFromHash(hash.slice(6));
            if (decoded && decoded.cells) {
              return decoded;
            }
          }
        } catch (e) {}

        try {
          const saved = window['local' + 'Storage'].getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.cells) {
              return parsed;
            }
          }
        } catch (e) {}

        return createEmptyInitialData();
      }

      let state = loadInitialState();
      let historyStack = [];
      let toastTimer = null;
      let isTapStyleMode = false;

      function saveState(showNotify = false) {
        updateSummary();
        try {
          window['local' + 'Storage'].setItem(STORAGE_KEY, JSON.stringify(state));
          if (window.location.hash && window.location.hash.startsWith('#data=')) {
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
          }
          if (showNotify) {
            showToast('保存しました');
          }
        } catch (e) {}
      }

      function copyShareUrl() {
        const encoded = encodeDataToHash(state);
        if (!encoded) {
          showToast('共有URLの生成に失敗しました');
          return;
        }
        const baseUrl = window.location.href.split('#')[0];
        const shareUrl = `${baseUrl}#data=${encoded}`;

        try {
          window.history.replaceState(null, '', `#data=${encoded}`);
        } catch (e) {}

        const tempInput = document.createElement('textarea');
        tempInput.value = shareUrl;
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.select();
        tempInput.setSelectionRange(0, 99999);
        try {
          document.execCommand('copy');
          showToast('共有URLをコピーしました！LINEやメールで送れます');
        } catch (err) {
          showToast('URLのコピーに失敗しました');
        }
        document.body.removeChild(tempInput);
      }

      function showToast(msg) {
        const el = document.getElementById('statusToast');
        el.textContent = msg;
        el.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.style.opacity = '0';
        }, 2400);
      }

      function pushHistory() {
        historyStack.push(JSON.stringify(state));
        if (historyStack.length > 20) historyStack.shift();
        document.getElementById('undoBtn').disabled = historyStack.length === 0;
      }

      function getRowClass(ageStr) {
        if (ageStr === '40~') return 'row-40plus';
        if (ageStr === '~19') return 'row-19under';
        const num = parseInt(ageStr, 10);
        if (num >= 30) {
          return num % 2 === 0 ? 'row-30s-even' : 'row-30s-odd';
        }
        return num % 2 === 1 ? 'row-20s-odd' : 'row-20s-even';
      }

      function renderPlayersHTML(players) {
        if (!players || players.length === 0) return '';
        return players
          .map((p, idx) => {
            const safeName = escapeHtml(p.name);
            let styleClass = 'player-normal';
            let styleAttr = 'normal';
            if (p.style === 'red') {
              styleClass = 'player-red';
              styleAttr = 'red';
            } else if (p.style === 'blue') {
              styleClass = 'player-blue';
              styleAttr = 'blue';
            }
            return `<span class="player-token ${styleClass}" data-style="${styleAttr}" data-idx="${idx}">${safeName}</span>`;
          })
          .join('・');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function parseCellDOMToPlayers(cellEl) {
        const result = [];
        function extractSegments(node, currentStyle) {
          if (node.nodeType === Node.TEXT_NODE) {
            const text = node.textContent;
            if (text) {
              const parts = text.split(/[・、,\n]+/);
              parts.forEach((part) => {
                const trimmed = part.trim();
                if (trimmed) {
                  result.push({ name: trimmed, style: currentStyle });
                }
              });
            }
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            let nextStyle = currentStyle;
            if (node.classList.contains('player-red') || node.dataset.style === 'red') {
              nextStyle = 'red';
            } else if (node.classList.contains('player-blue') || node.dataset.style === 'blue') {
              nextStyle = 'blue';
            } else if (node.classList.contains('player-normal') || node.dataset.style === 'normal') {
              nextStyle = 'normal';
            }
            node.childNodes.forEach((child) => extractSegments(child, nextStyle));
          }
        }
        extractSegments(cellEl, 'normal');
        return result;
      }

      function renderTable() {
        const tbody = document.getElementById('sheetBody');
        tbody.innerHTML = '';

        AGE_ROWS.forEach((age) => {
          const tr = document.createElement('tr');
          tr.className = getRowClass(age);

          const ageTd = document.createElement('td');
          ageTd.className = 'sticky-age-cell font-black text-gray-900 select-none';
          ageTd.textContent = age;
          tr.appendChild(ageTd);

          COLUMNS.forEach((col) => {
            const td = document.createElement('td');
            td.className = `editable-cell ${col.groupClass}`;
            td.contentEditable = isTapStyleMode ? 'false' : 'true';
            td.spellcheck = false;
            td.dataset.age = age;
            td.dataset.col = col.key;

            const players = (state.cells[age] && state.cells[age][col.key]) || [];
            td.innerHTML = renderPlayersHTML(players);

            td.addEventListener('click', (e) => {
              if (!isTapStyleMode) return;
              const tokenEl = e.target.closest('.player-token');
              const currentList = (state.cells[age] && state.cells[age][col.key]) || [];
              if (currentList.length === 0) return;

              pushHistory();
              const order = ['normal', 'red', 'blue'];

              if (tokenEl && tokenEl.dataset.idx !== undefined) {
                const idx = parseInt(tokenEl.dataset.idx, 10);
                if (currentList[idx]) {
                  const nextStyle = order[(order.indexOf(currentList[idx].style || 'normal') + 1) % order.length];
                  currentList[idx].style = nextStyle;
                }
              } else {
                const nextStyle = order[(order.indexOf(currentList[0].style || 'normal') + 1) % order.length];
                currentList[0].style = nextStyle;
              }

              td.innerHTML = renderPlayersHTML(currentList);
              saveState(false);
            });

            td.addEventListener('blur', () => {
              if (isTapStyleMode) return;
              const parsed = parseCellDOMToPlayers(td);
              if (!state.cells[age]) state.cells[age] = {};
              state.cells[age][col.key] = parsed;
              td.innerHTML = renderPlayersHTML(parsed);
              saveState(false);
            });

            td.addEventListener('input', () => {
              if (isTapStyleMode) return;
              const parsed = parseCellDOMToPlayers(td);
              if (!state.cells[age]) state.cells[age] = {};
              state.cells[age][col.key] = parsed;
              saveState(false);
            });

            td.addEventListener('compositionend', () => {
              if (isTapStyleMode) return;
              const parsed = parseCellDOMToPlayers(td);
              if (!state.cells[age]) state.cells[age] = {};
              state.cells[age][col.key] = parsed;
              saveState(false);
            });

            td.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                td.blur();
              }
            });

            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        const yearInput = document.getElementById('yearInput');
        const yearBadge = document.getElementById('sheetYearBadge');
        const titleEl = document.getElementById('sheetTitle');

        yearInput.value = state.year !== undefined ? state.year : '2026年度';
        yearBadge.textContent = state.year || '年度未設定';
        titleEl.textContent = state.title || 'ポジション、年齢別／12球団バランスシート';

        updateSummary();
      }

      function updateSummary() {
        let total = 0;
        let pitchers = 0;
        let catchers = 0;
        let infielders = 0;
        let outfielders = 0;

        AGE_ROWS.forEach((age) => {
          const row = state.cells[age] || {};
          COLUMNS.forEach((col) => {
            const count = (row[col.key] || []).length;
            total += count;
            if (col.key.startsWith('p_')) pitchers += count;
            else if (col.key === 'c') catchers += count;
            else if (col.key.startsWith('if_')) infielders += count;
            else if (col.key.startsWith('of_')) outfielders += count;
          });
        });

        document.getElementById('playerCountSummary').textContent =
          `合計 ${total}名（投手:${pitchers} / 捕手:${catchers} / 内野:${infielders} / 外野:${outfielders}）`;
      }

      function incrementYearString(str) {
        const trimmed = String(str || '').trim();
        const match = trimmed.match(/(\d+)/);
        if (match) {
          const num = parseInt(match[1], 10);
          return trimmed.replace(match[1], String(num + 1));
        }
        return trimmed;
      }

      function advanceOneYear() {
        pushHistory();
        const nextYear = incrementYearString(state.year);
        state.year = nextYear;

        const newCells = {};
        AGE_ROWS.forEach((age) => {
          newCells[age] = {};
          COLUMNS.forEach((col) => {
            newCells[age][col.key] = [];
          });
        });

        for (let i = AGE_ROWS.length - 1; i >= 0; i--) {
          const currentAge = AGE_ROWS[i];
          const currentRow = state.cells[currentAge] || {};

          if (i === 0) {
            COLUMNS.forEach((col) => {
              const staying = currentRow[col.key] || [];
              newCells['40~'][col.key] = [...staying, ...newCells['40~'][col.key]];
            });
          } else {
            const targetAge = AGE_ROWS[i - 1];
            COLUMNS.forEach((col) => {
              const moving = currentRow[col.key] || [];
              newCells[targetAge][col.key] = [...moving];
            });
          }
        }

        state.cells = newCells;
        saveState(false);
        renderTable();
        showToast(nextYear ? `「${nextYear}」に更新し、全選手を +1歳 移動しました` : '全選手を +1歳 移動しました');
      }

      function applyStyleToSelection(styleType) {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
          showToast('装飾したい選手名をドラッグして選択してください');
          return;
        }

        const range = selection.getRangeAt(0);
        const container = range.commonAncestorContainer;
        const cellEl = (container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement)?.closest('.editable-cell');

        if (!cellEl) {
          showToast('表のマス目内の文字を選択してください');
          return;
        }

        const age = cellEl.dataset.age;
        const colKey = cellEl.dataset.col;
        pushHistory();

        const span = document.createElement('span');
        span.className = styleType === 'red' ? 'player-red' : styleType === 'blue' ? 'player-blue' : 'player-normal';
        span.dataset.style = styleType;

        try {
          const fragment = range.extractContents();
          span.appendChild(fragment);
          range.insertNode(span);
          selection.removeAllRanges();

          const parsed = parseCellDOMToPlayers(cellEl);
          if (!state.cells[age]) state.cells[age] = {};
          state.cells[age][colKey] = parsed;
          cellEl.innerHTML = renderPlayersHTML(parsed);
          saveState(false);
        } catch (e) {}
      }

      function toggleTapStyleMode() {
        isTapStyleMode = !isTapStyleMode;
        const wrapper = document.getElementById('tableScrollWrapper');
        const btn = document.getElementById('tapModeBtn');
        const statusBadge = document.getElementById('tapModeStatus');
        const guideText = document.getElementById('modeGuideText');

        btn.setAttribute('aria-pressed', String(isTapStyleMode));

        if (isTapStyleMode) {
          wrapper.classList.add('tap-style-mode');
          btn.classList.remove('bg-amber-50', 'border-amber-400', 'text-amber-900');
          btn.classList.add('bg-amber-500', 'border-amber-600', 'text-white');
          statusBadge.textContent = 'ON';
          statusBadge.classList.remove('bg-gray-600');
          statusBadge.classList.add('bg-gray-900');
          guideText.innerHTML = '👆 <strong class="text-amber-800">タップ装飾モード中：</strong>選手名をタップするたびに「黒字 → 赤枠白字 → 青字」が切り替わります。';
        } else {
          wrapper.classList.remove('tap-style-mode');
          btn.classList.add('bg-amber-50', 'border-amber-400', 'text-amber-900');
          btn.classList.remove('bg-amber-500', 'border-amber-600', 'text-white');
          statusBadge.textContent = 'OFF';
          statusBadge.classList.add('bg-gray-600');
          statusBadge.classList.remove('bg-gray-900');
          guideText.innerHTML = '💡 枠をタップして<strong class="text-gray-800">直接文字入力</strong>（複数名は「・」区切り）。色分けは「👆 タップ装飾」をONにしてタップで切替。';
        }

        document.querySelectorAll('.editable-cell').forEach((cell) => {
          cell.contentEditable = isTapStyleMode ? 'false' : 'true';
        });
      }

      function openConfirmModal(title, message, onConfirm) {
        const modal = document.getElementById('confirmModal');
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalMessage').textContent = message;
        modal.classList.remove('hidden');
        modal.classList.add('flex');

        const okBtn = document.getElementById('modalOkBtn');
        const cancelBtn = document.getElementById('modalCancelBtn');

        const cleanup = () => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
          okBtn.onclick = null;
          cancelBtn.onclick = null;
        };

        cancelBtn.onclick = cleanup;
        okBtn.onclick = () => {
          cleanup();
          onConfirm();
        };
      }

      function init() {
        renderTable();

        if (window.location.hash && window.location.hash.startsWith('#data=')) {
          saveState(false);
          showToast('共有リンクのデータを読み込みました');
        }

        const flushActiveCellAndSave = () => {
          const active = document.activeElement;
          if (active && active.classList && active.classList.contains('editable-cell')) {
            const age = active.dataset.age;
            const colKey = active.dataset.col;
            if (age && colKey) {
              const parsed = parseCellDOMToPlayers(active);
              if (!state.cells[age]) state.cells[age] = {};
              state.cells[age][colKey] = parsed;
            }
          }
          saveState(false);
        };
        window.addEventListener('pagehide', flushActiveCellAndSave);
        window.addEventListener('beforeunload', flushActiveCellAndSave);

        window.addEventListener('pageshow', (e) => {
          if (e.persisted) {
            state = loadInitialState();
            renderTable();
          }
        });

        document.getElementById('shareUrlBtn').addEventListener('click', copyShareUrl);
        document.getElementById('tapModeBtn').addEventListener('click', toggleTapStyleMode);

        const yearInput = document.getElementById('yearInput');
        yearInput.addEventListener('input', (e) => {
          state.year = e.target.value;
          document.getElementById('sheetYearBadge').textContent = state.year || '年度未設定';
          saveState(false);
        });

        const titleEl = document.getElementById('sheetTitle');
        titleEl.addEventListener('input', () => {
          state.title = titleEl.textContent.trim();
          saveState(false);
        });

        document.getElementById('advanceYearBtn').addEventListener('click', advanceOneYear);

        document.getElementById('undoBtn').addEventListener('click', () => {
          if (historyStack.length === 0) return;
          const prev = historyStack.pop();
          state = JSON.parse(prev);
          document.getElementById('undoBtn').disabled = historyStack.length === 0;
          saveState(false);
          renderTable();
          showToast('1つ前の状態に戻しました');
        });

        document.querySelectorAll('.style-btn').forEach((btn) => {
          btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            applyStyleToSelection(btn.dataset.style);
          });
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
          try {
            const jsonStr = JSON.stringify(state, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const safeYear = (state.year || 'balance_sheet').replace(/[\\/:*?"<>|]/g, '_');
            a.href = url;
            a.download = `baseball_balance_sheet_${safeYear}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('JSONファイルをダウンロードしました');
          } catch (e) {
            showToast('ファイルの書き出しに失敗しました');
          }
        });

        const importInput = document.getElementById('importFileInput');
        document.getElementById('importBtn').addEventListener('click', () => {
          importInput.value = '';
          importInput.click();
        });
        importInput.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              if (!parsed || typeof parsed.cells !== 'object') {
                throw new Error('Invalid format');
              }
              pushHistory();
              state = parsed;
              saveState(false);
              renderTable();
              showToast('JSONデータを読み込みました');
            } catch (err) {
              showToast('無効なJSONファイルです');
            }
          };
          reader.readAsText(file);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
          openConfirmModal(
            '白紙状態にリセット',
            '現在入力されているすべての選手名を消去し、白紙（空欄）の初期状態に戻しますか？',
            () => {
              pushHistory();
              state = createEmptyInitialData();
              saveState(false);
              renderTable();
              showToast('白紙状態にリセットしました');
            }
          );
        });
      }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
